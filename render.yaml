services:
  - type: web
    name: ble-attendance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ble-attendance-db
          property: connectionString
      - key: ACCESS_TOKEN_MINUTES
        value: 720
      - key: ATTENDANCE_SESSION_SECONDS
        value: 90
      - key: BLE_ROTATION_SECONDS
        value: 10

databases:
  - name: ble-attendance-db
    plan: free
